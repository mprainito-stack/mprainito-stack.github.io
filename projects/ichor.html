              <figcaption class="body">
                <div class="text">
                                <p>A hemoglobin-based physical reservoir computer, designed for in situ biological monitoring. Chemical inputs are written into a 50 µm hemoglobin film through a 6×6 inlet array under a controlled O₂/N₂ atmosphere. Because hemoglobin's absorption changes with its oxygen saturation, the film's state can be read with light: LEDs at 576 and 584 nm illuminate the chamber from below, and a cooled sCMOS camera images the saturation map through a 10× objective. That map is the reservoir's readout.</p>
                  <p>I designed the device and its optical stack, validated the write architectures in simulation, and ran the design tradeoff sweeps behind it. It appears as the early-stage blueprint in my first-author manuscript on chemical reservoirs.</p>
                  <ul class="pills"><li>Optical design</li><li>Microfluidics</li><li>COMSOL</li><li>Python</li><li>2025–2026</li></ul>
                  <div class="links"><a href="../assets/projects/ichor-blueprint-full.jpg" rel="noopener">Full-resolution blueprint</a></div>
                </div>
                <dl class="spec">
                  <div><dt>Reservoir</dt><dd>50 µm hemoglobin film in a fused-silica chamber, fed by a 6×6 inlet array</dd></div>
                  <div><dt>Atmosphere</dt><dd>O₂ / N₂ set-point through a gas manifold and membrane</dd></div>
                  <div><dt>Read-out</dt><dd>576 / 584 nm LEDs, 10× objective (NA 0.25), cooled sCMOS saturation-map imaging</dd></div>
                  <div><dt>Fluidics</dt><dd>Syringe pump, valve manifold, input chemistry, hemoglobin and waste reservoirs</dd></div>
                </dl>
